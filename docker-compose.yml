version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql://finsight_user:secure_password_2026@postgres:5432/finsight_db
      - MONGODB_URI=mongodb://mongo:27017/finsight_docs
      - SECRET_KEY=finsight_ai_super_secret_enterprise_jwt_key_2026_x89f2a
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./reports/output:/app/reports/output
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: finsight_user
      POSTGRES_PASSWORD: secure_password_2026
      POSTGRES_DB: finsight_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight_user -d finsight_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
